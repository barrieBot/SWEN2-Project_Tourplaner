<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" >
  <h2>login:</h2>

  <div class="dialog_group">
    <tui-textfield>
      <label tuiLabel>Email or Username</label>
      <input tuiInput type="text" formControlName="username" placeholder="YourUser123 or your@email.here">
    </tui-textfield>
    <tui-error
      [formControl]="loginForm.controls.username"
    />

  </div>

  <div class="dialog_group">
    <tui-textfield>
      <label tuiLabel>Password</label>
      <input tuiInput type="password" formControlName="password" placeholder="*****">
      <tui-icon tuiPassword/>
    </tui-textfield>
    <tui-error
      [formControl]="loginForm.controls.password"
    />
  </div>

  <div class="login_actions">
    <button tuiButton size="l" type="submit" [disabled]="loginForm.invalid">Submit</button>
    <button tuiButton appearance="flat" size="l" routerLink="/auth/register">register -></button>
  </div>
</form>
