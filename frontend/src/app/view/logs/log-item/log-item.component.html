@if (log(); as item) {
  <div class="log_item" [class.expanded]="isExpanded()">
    <button type="button" class="log_shorthand" (click)="open.emit()">
      <div class="meta_left">
        <span class="tui-text_body-m-bold">{{ item.dateTime }}</span>
        <span class="log_id">#{{ logID() }}</span>
        <tui-rating
          [ngModel]="item.rating"
          [readOnly]="true"
          size="s"
        ></tui-rating>
      </div>

      <div class="meta_right">
        <span tuiBadge size="s" [appearance]="difficultyTag().appearance">
          {{ difficultyTag().label }}
        </span>
        <tui-icon
          icon="@tui.chevron-down"
          class="chevron"
          [class.rotated]="isExpanded()"
        ></tui-icon>
      </div>
    </button>

    <tui-expand [expanded]="isExpanded()">
      <div class="log_details read_mode">
        <p class="tui-text_body-m comment_text">{{ item.comment || 'No comment provided.' }}</p>
        <div class="actions">
          <button
            tuiButton
            appearance="secondary"
            size="s"
            iconStart="@tui.pencil"
            (click)="openEditor()"
          >
            Edit
          </button>
          <button
            tuiButton
            appearance="critical"
            size="s"
            iconStart="@tui.trash"
            (click)="deleteLog(item.id)"
          >
            Delete
          </button>
        </div>
      </div>
    </tui-expand>
  </div>
}
