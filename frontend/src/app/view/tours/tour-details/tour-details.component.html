
<div class="tour-detail-header">
  <h1 class="tour-title">{{tour()!.name}}</h1>
  <div class="action_bar">
    <button (click)="edit()" >edit</button>
    <button (click)="addLog()">+log</button>
    <button (click)="deleteTour()">delete</button>
    <button (click)="close()">x</button>
  </div>
</div>

<div class="tour-detail-body">
  <div class="tour-data">
    <div class="tour-meta">
      <div class="meta">
        <span class="label">dist: </span>
        <span class="value">{{tour()!.distance}}</span>
      </div>

      <div class="meta">
        <span class="label">time: </span>
        <span class="value">{{tour()!.estimatedTime}}</span>
      </div>

      <div class="meta">
        <span class="label">difficulty: </span>
        <span class="value">{{tour()!.childFriendliness}}</span>
      </div>

    </div>

    <div class="tour-descritpion">
      <h3>Description</h3>
      <p>{{tour()!.description}}</p>
    </div>
  </div>

  <div class="tour-logs">
    <app-log-list/>
  </div>

</div>
