spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PWD}
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
    show-sql: false


app:
  security:
    jwt:
      jwt-secret: ${JWT_SECRET}
      jwt-expiration-ms : ${JWT_EXPIRATION_MS}
    ors:
      ors-base-url: ${ORS_BASE_URL}
      ors-api-token: ${ORS_API_TOKEN}
    cors:
      cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:"*"}